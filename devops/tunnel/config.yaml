tunnel: qrono-tunnel
credentials-file: ./credentials.json

ingress:
  # Backend API
  - hostname: qrono-api.yourdomain.com
    service: http://localhost:3000
    originRequest:
      noTLSVerify: true

  # Flutter Web App (if needed)
  - hostname: qrono-app.yourdomain.com
    service: http://localhost:8080
    originRequest:
      noTLSVerify: true

  # Catch-all
  - service: http_status:404